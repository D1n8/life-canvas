version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: life_system_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: life_system
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: life_system_api
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASS: password
      DB_NAME: life_system
      PORT: 3000
    volumes:
      - ./src:/app/src  # Hot reload: изменения в коде сразу видны
      - ./package.json:/app/package.json

volumes:
  pgdata: